		<script>
			// Initialize Reveal.js
			Reveal.initialize({
				hash: true,
				controls: false,
				progress: false,
				slideNumber: false,
				keyboard: false,
				// PPDSSparqlEditor, then LiveBackground, straight after RevealMarkdown (see the plugins)
				plugins: [RevealMarkdown, PPDSSparqlEditor, LiveBackground, PPDSMenuCallouts, RevealNotes, RevealZoom, RemoteSPARQLEditor, RevealMath.KaTeX], //, RevealChalkboard
				transition: "fade", // Options: 'fade', 'slide', 'convex', 'concave', 'zoom'
				katex: {
					// Pinned, not "latest": a deck is an archive, and a talk that
					// renders today should render the same way in two years.
					version: "0.18.7",
					// KaTeX's default list omits `code`, so a slide carrying two
					// inline snippets like `$this` and `$value` has them read as a
					// math pair. These decks are full of SPARQL; math inside code
					// is never wanted. Keep the rest of the default list.
					ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
				},
			});

			// The parent PPDS deck owns navigation. Forward keys pressed while the
			// embedded Reveal deck has focus so mouse-free navigation still works.
			window.addEventListener("keydown", (event) => {
				if (["ArrowRight", "PageDown", " ", "ArrowLeft", "PageUp"].includes(event.key)) {
					event.preventDefault();
					window.parent.postMessage({ type: "ivo-key", key: event.key }, "*");
				}
			});

			// Ensure code blocks have correct language classes and highlight them
			Reveal.on("ready", () => {
				window.parent.postMessage({ type: "ivo-ready" }, "*");
				document.querySelectorAll("code").forEach((block) => {
					block.classList.forEach((cls) => {
						if (!cls.startsWith("language-")) {
							block.classList.add(`language-${cls}`);
						}
					});
				});

				Prism.highlightAll();
			});
		</script>

		<!-- Mermaid.js Integration -->
		<script type="module">
			import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

			mermaid.initialize({ startOnLoad: false });

			function renderMermaid() {
				document.querySelectorAll("code.language-mermaid").forEach((block) => {
					const parent = block.parentElement;
					if (parent && !parent.classList.contains("mermaid")) {
						const pre = parent;
						const container = document.createElement("div");
						container.classList.add("mermaid");
						container.innerHTML = block.textContent;
						pre.replaceWith(container);
						// Reveal centred the slide on the code block; centre it again on the diagram
						mermaid.init(undefined, container).then(() => Reveal.layout());
					}
				});
			}

			// A module script runs only once Mermaid has downloaded, usually after
			// Reveal is ready, so a "ready" listener added now would never fire
			if (Reveal.isReady()) renderMermaid();
			else Reveal.on("ready", renderMermaid);
			Reveal.on("slidechanged", renderMermaid);
		</script>

		<script>
			// Function to render the bar chart for a given table and container
			function renderBarChart(table, container) {
				if (!table || !container) return;

				// Parse data from table
				const data = Array.from(table.tBodies[0].rows).map((row) => ({
					name: row.cells[0].textContent.trim(),
					value: +row.cells[1].textContent.trim(),
				}));

				// Clear any previous chart
				container.innerHTML = "";

				const width = 800;
				const height = 400;
				const margin = { top: 30, right: 50, bottom: 40, left: 150 };

				const svg = d3.select(container).append("svg").attr("width", width).attr("height", height).attr("style", "background: transparent");

				const x = d3
					.scaleLinear()
					.domain([0, d3.max(data, (d) => d.value)])
					.range([margin.left, width - margin.right]);

				const y = d3
					.scaleBand()
					.domain(data.map((d) => d.name))
					.range([margin.top, height - margin.bottom])
					.padding(0.1);

				svg
					.selectAll("rect")
					.data(data)
					.join("rect")
					.attr("class", "bar-rect")
					.attr("x", margin.left)
					.attr("y", (d) => y(d.name))
					.attr("width", (d) => x(d.value) - margin.left)
					.attr("height", y.bandwidth());

				svg
					.selectAll("text.value")
					.data(data)
					.join("text")
					.attr("class", "value")
					.attr("x", (d) => Math.min(x(d.value) - 10, width - 60))
					.attr("y", (d) => y(d.name) + y.bandwidth() / 2)
					.attr("dy", "0.35em")
					.attr("fill", "white")
					.attr("text-anchor", "end")
					.text((d) => `$${d.value}M`);

				// Y-axis
				svg
					.append("g")
					.attr("class", "y-axis")
					.attr("transform", `translate(${margin.left},0)`)
					.call(d3.axisLeft(y))
					.selectAll("text")
					.attr("fill", "white")
					.style("font-size", "11px");

				// X-axis with fixed ticks for stability
				svg
					.append("g")
					.attr("class", "x-axis")
					.attr("transform", `translate(0,${height - margin.bottom})`)
					.call(
						d3
							.axisBottom(x)
							.ticks(5)
							.tickFormat((d) => `$${Math.round(d)}M`)
					)
					.selectAll("text")
					.attr("fill", "white")
					.style("font-size", "11px");

				// Ensure axis lines and ticks are visible
				svg.selectAll(".x-axis path, .x-axis line, .y-axis path, .y-axis line").attr("stroke", "white");
			}

			// Render chart on slide change
			Reveal.on("slidechanged", (event) => {
				const currentSlide = event.currentSlide;
				const table = currentSlide.querySelector(".data-chart-table");
				const container = currentSlide.querySelector("#bar-chart");
				renderBarChart(table, container);
			});

			// Render chart on initial load
			Reveal.on("ready", (event) => {
				const currentSlide = event.currentSlide;
				const table = currentSlide.querySelector(".data-chart-table");
				const container = currentSlide.querySelector("#bar-chart");
				renderBarChart(table, container);
			});
		</script>
